name: Automated Gathering & Event Reminders

on:
  schedule:
    # Runs every 15 minutes to evaluate 24h, 12h, 1h, and live reminder stages
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  dispatch-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminders cron endpoint
        run: |
          if [ -n "${{ secrets.CRON_SECRET }}" ]; then
            curl -s -X GET "https://www.theschoolofprophets.site/api/cron/reminders?secret=${{ secrets.CRON_SECRET }}"
          else
            curl -s -X GET "https://www.theschoolofprophets.site/api/cron/reminders"
          fi
